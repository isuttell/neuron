repos:
# Standard pre-commit hooks
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-json
        exclude: ^(tsconfig.*\.json|\.vscode/.*\.json)$
    -   id: check-toml
    -   id: check-merge-conflict
    -   id: debug-statements

# Python linting with Ruff
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.11
    hooks:
    -   id: ruff
        args: [--fix]
        files: ^src/neuron_server/

# Gitea Actions linting
-   repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
    -   id: actionlint
        name: Lint Gitea Actions workflow files
        description: Lint Gitea Actions workflow YAML files using actionlint
        files: ^\.gitea/workflows/.*\.ya?ml$

# Local hooks for project-specific checks
-   repo: local
    hooks:
    # Backend Python tests - only run on changed test files
    -   id: backend-test-changed
        name: Backend Tests (Changed Files)
        entry: bash -c 'files=$(echo "$@" | tr " " "\n" | grep -E "test_.*\.py$|.*_test\.py$"); if [ -n "$files" ]; then poetry run pytest -x $files; fi'
        language: system
        pass_filenames: true
        types: [python]
        files: ^src/neuron_server/.*test.*\.py$

    # Frontend linting with auto-fix
    -   id: frontend-lint
        name: Frontend Lint
        entry: npm run lint -- --fix
        language: system
        files: ^src/neuron_client/src/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

    # Frontend TypeScript type checking - lighter than full build
    -   id: frontend-typecheck
        name: Frontend Type Check
        entry: npx tsc --noEmit
        language: system
        files: ^(src/neuron_client/src/.*\.(ts|tsx)|tsconfig.*\.json)$
        pass_filenames: false

    # Frontend tests - only run on changed test files
    -   id: frontend-test-changed
        name: Frontend Tests (Changed Files)
        entry: bash -c 'files=$(echo "$@" | tr " " "\n" | grep -E "\.test\.(tsx?|jsx?)$|\.spec\.(tsx?|jsx?)$"); if [ -n "$files" ]; then npm test -- --findRelatedTests $files --watchAll=false; fi'
        language: system
        pass_filenames: true
        files: ^src/neuron_client/src/.*\.(test|spec)\.(ts|tsx|js|jsx)$
