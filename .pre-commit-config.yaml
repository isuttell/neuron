repos:
# Standard pre-commit hooks
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-json
        exclude: ^(tsconfig.*\.json|\.vscode/.*\.json|src/dashboard-viewer/tsconfig.*\.json)$
    -   id: check-toml
    -   id: check-merge-conflict
    -   id: debug-statements

# Python linting with Ruff
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.11
    hooks:
    -   id: ruff
        args: [--fix]
        files: ^src/neuron_server/

# Gitea Actions linting
-   repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
    -   id: actionlint
        name: Lint Gitea Actions workflow files
        description: Lint Gitea Actions workflow YAML files using actionlint
        files: ^\.gitea/workflows/.*\.ya?ml$

# Local hooks for project-specific checks
-   repo: local
    hooks:
    # Frontend linting with auto-fix
    -   id: frontend-lint
        name: Frontend Lint
        entry: npm run lint -- --fix
        language: system
        files: ^src/neuron_client/src/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

    # Frontend TypeScript type checking - lighter than full build
    -   id: frontend-typecheck
        name: Frontend Type Check
        entry: npx tsc --noEmit
        language: system
        files: ^(src/neuron_client/src/.*\.(ts|tsx)|tsconfig.*\.json)$
        pass_filenames: false
