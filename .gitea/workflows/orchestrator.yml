name: Test Orchestrator

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]

jobs:
  # Determine what files changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/neuron_server/**'
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'Dockerfile'
            frontend:
              - 'src/neuron_client/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'tailwind.config.js'
              - 'vite.config.ts'
              - 'Dockerfile.client'
            workflows:
              - '.gitea/workflows/**'
            code:
              - 'src/**'
              - '*.py'
              - '*.ts'
              - '*.tsx'
              - '*.js'
              - '*.jsx'
              - '.gitea/workflows/**'
            docs:
              - '**/*.md'
              - 'docs/**'

  # Run backend tests if backend files changed
  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: |
          pipx install poetry==2.1.3
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'
          cache-dependency-path: poetry.lock

      - name: Set Poetry environment
        run: poetry env use ${{ steps.setup-python.outputs.python-path }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint with Ruff
        run: poetry run ruff check src/neuron_server/

      - name: Run tests
        run: poetry run pytest src/neuron_server/

  # Docker build verification for backend
  backend-docker-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: false
          load: true
          tags: gitea.zaks.io/isuttell/neuron-server:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Run frontend tests if frontend files changed
  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Docker build verification for frontend
  frontend-docker-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.client
          builder: ${{ steps.buildx.outputs.name }}
          push: false
          load: true
          tags: gitea.zaks.io/isuttell/neuron-client:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # Run workflow linting if workflows changed
  workflow-lint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cache actionlint binary
      - name: Cache actionlint
        id: cache-actionlint
        uses: actions/cache@v4
        with:
          path: /usr/bin/actionlint
          key: ${{ runner.os }}-actionlint-v1.6.26

      # Install actionlint if not cached
      - name: Install actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        run: |
          echo "Installing actionlint..."
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest /usr/bin

      # Run actionlint on all workflow files
      - name: Run actionlint
        run: |
          actionlint .gitea/workflows/*.yml

          # Check exit code
          if [ $? -eq 0 ]; then
            echo "✅ All workflow files passed actionlint checks"
          else
            echo "❌ Some workflow files failed actionlint checks"
            exit 1
          fi

  # Check if all relevant tests passed
  tests-passed:
    needs: [changes, backend-tests, backend-docker-build, frontend-tests, frontend-docker-build, workflow-lint]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      all-passed: ${{ steps.check.outputs.all-passed }}
    steps:
      - name: Check test results
        id: check
        run: |
          # Default to true
          ALL_PASSED=true

          # Check backend tests if backend changed
          if [[ "${{ needs.changes.outputs.backend }}" == "true" ]]; then
            if [[ "${{ needs.backend-tests.result }}" != "success" ]]; then
              echo "Backend tests failed or were cancelled"
              ALL_PASSED=false
            fi
            # Check Docker build only for PRs to master
            if [[ "${{ github.base_ref }}" == "master" ]] && [[ "${{ needs.backend-docker-build.result }}" != "success" ]]; then
              echo "Backend Docker build failed or was cancelled"
              ALL_PASSED=false
            fi
          fi

          # Check frontend tests if frontend changed
          if [[ "${{ needs.changes.outputs.frontend }}" == "true" ]]; then
            if [[ "${{ needs.frontend-tests.result }}" != "success" ]]; then
              echo "Frontend tests failed or were cancelled"
              ALL_PASSED=false
            fi
            # Check Docker build only for PRs to master
            if [[ "${{ github.base_ref }}" == "master" ]] && [[ "${{ needs.frontend-docker-build.result }}" != "success" ]]; then
              echo "Frontend Docker build failed or was cancelled"
              ALL_PASSED=false
            fi
          fi

          # Check workflow lint if workflows changed
          if [[ "${{ needs.changes.outputs.workflows }}" == "true" ]]; then
            if [[ "${{ needs.workflow-lint.result }}" != "success" ]]; then
              echo "Workflow linting failed or was cancelled"
              ALL_PASSED=false
            fi
          fi

          echo "all-passed=$ALL_PASSED" >> $GITHUB_OUTPUT

          if [[ "$ALL_PASSED" == "false" ]]; then
            echo "❌ Some tests failed - code review will be skipped"
            exit 1
          else
            echo "✅ All relevant tests passed"
          fi

  # Run code review only if:
  # 1. Code files were changed
  # 2. All relevant tests passed
  code-review:
    needs: [changes, tests-passed]
    if: needs.changes.outputs.code == 'true' && needs.tests-passed.outputs.all-passed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache tools directory
      - name: Cache tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ./.tools
          key: ${{ runner.os }}-tools-v1-gitea-mcp-0.1.9-tea-0.9.2-jq-1.7.1-actionlint-1.6.26

      # Install tools if cache miss
      - name: Install tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools
          echo "Installing gitea-mcp..."
          curl -L -f -o gitea-mcp_Linux_x86_64.tar.gz https://gitea.com/gitea/gitea-mcp/releases/download/v0.1.9/gitea-mcp_Linux_x86_64.tar.gz
          tar -xzf gitea-mcp_Linux_x86_64.tar.gz -C .tools
          chmod +x .tools/gitea-mcp
          rm gitea-mcp_Linux_x86_64.tar.gz
          echo "Installing tea CLI..."
          curl -L -f -o .tools/tea https://dl.gitea.io/tea/0.9.2/tea-0.9.2-linux-amd64
          chmod +x .tools/tea
          echo "Installing jq..."
          curl -L -f -o .tools/jq https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
          chmod +x .tools/jq
          echo "Installing actionlint..."
          curl -L -f -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.6.26/actionlint_1.6.26_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz -C .tools actionlint
          chmod +x .tools/actionlint
          rm actionlint.tar.gz

      - name: Add tools to PATH
        run: echo "$PWD/.tools" >> $GITHUB_PATH

      # Authenticate tea
      - name: Authenticate tea
        env:
          GITEA_SERVER_URL: https://gitea.zaks.io
          GITEA_SERVER_TOKEN: ${{ secrets.GT_TOKEN }}
        run: tea login add --name ci

      # Setup Node.js with npm cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # Install Poetry
      - name: Install Poetry
        run: |
          pipx install poetry==2.1.3
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Setup Python with poetry cache
      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'
          cache-dependency-path: poetry.lock

      # Set Poetry environment
      - name: Set Poetry environment
        run: poetry env use ${{ steps.setup-python.outputs.python-path }}

      # Install npm dependencies
      - name: Install npm dependencies
        run: npm ci

      # Install poetry dependencies
      - name: Install poetry dependencies
        run: poetry install --no-interaction

      # Setup MCP configuration
      - name: Setup MCP Configuration
        env:
          GITEA_ACCESS_TOKEN: ${{ secrets.GT_TOKEN }}
          GITEA_BASE: ${{ github.server_url }}
        run: |
          cat > mcp-config.json << EOF
          {
            "mcpServers": {
              "gitea": {
                "command": "${{ github.workspace }}/.tools/gitea-mcp",
                "args": ["-host", "${{ github.server_url }}", "-token", "${{ secrets.GT_TOKEN }}"],
                "env": {
                  "GITEA_ACCESS_TOKEN": "${{ secrets.GT_TOKEN }}",
                  "GITEA_BASE": "${{ github.server_url }}"
                }
              }
            }
          }
          EOF

      # Run Claude Code review
      - name: Claude Code Review
        uses: anthropics/claude-code-base-action@beta
        env:
          GITEA_ACCESS_TOKEN: ${{ secrets.GT_TOKEN }}
          GITEA_BASE: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-4-20250514"
          mcp_config: "mcp-config.json"
          allowed_tools: "Read,View,Glob,GlobTool,Grep,GrepTool,Search,LS,Bash(git:*),Bash(tea:*),Bash(find:*),Bash(ls:*),Bash(grep:*),Bash(jq:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(diff:*),Bash(sed:*),WebFetch(gitea.zaks.io:*),WebFetch(https://gitea.zaks.io:*),mcp__gitea__create_issue_comment,mcp__gitea__get_pull_request_by_index,mcp__gitea__list_repo_issues,mcp__gitea__get_issue_by_index"
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}. All tests and code quality checks have completed succesfully.

            Steps to follow:
            1. Get PR details using: mcp__gitea__get_pull_request_by_index with index ${{ github.event.pull_request.number }}
            2. Read existing PR comments using: tea pr --repo isuttell/neuron --comments ${{ github.event.pull_request.number }}
            3. Use WebFetch to get the diff from https://gitea.zaks.io/api/v1/repos/isuttell/neuron/pulls/${{ github.event.pull_request.number }}.diff
            4. Analyze code quality, potential bugs, style consistency, and improvements
            5. Use the Gitea MCP tools to leave a comment with your recommendations and a final Approved or Not Approved

            Your final report should be:
            - Short, to the point and professional
            - Specific with line numbers when possible
            - Focused on problems and potential improvements
            - Free of unnecessary explanations
            - Build on previous conversations from existing comments
            - Address changes made since your last review (if any)
            - Acknowledge fixes to previously identified issues
            - Avoid repeating feedback already given in previous reviews on this PR
            - Keep follow-up reviews brief if there are minimal changes since your last review

            IMPORTANT: If you encounter any errors, permission issues, or need additional access during the review process, leave a comment on the PR explaining what went wrong and what additional access or fixes are needed.
