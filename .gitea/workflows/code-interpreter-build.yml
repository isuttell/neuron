name: Code Interpreter Build

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'Dockerfile.code'
      - '.gitea/workflows/code-interpreter-build.yml'

jobs:
  build-code-interpreter:
    runs-on: ubuntu-latest
    if: false  # Skip this job
    steps:
      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.zaks.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and push code-interpreter
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.code
          push: true
          builder: default
          tags: gitea.zaks.io/isuttell/code-interpreter:latest
