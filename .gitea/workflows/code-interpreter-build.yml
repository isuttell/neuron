name: Code Interpreter Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build-code-interpreter:
    runs-on: ubuntu-latest
    if: false  # Skip this job
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.zaks.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and push code-interpreter
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.code
          push: true
          tags: gitea.zaks.io/isuttell/code-interpreter:latest
