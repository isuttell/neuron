name: Claude Auto-Fix Issue

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'auto-fix' || contains(github.event.issue.labels.*.name, 'auto-fix')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GT_TOKEN }}

      # Cache tools directory
      - name: Cache tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ./.tools
          key: ${{ runner.os }}-tools-v1-gitea-mcp-0.1.9-tea-0.9.2-jq-1.7.1

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Setup Python for testing
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache npm dependencies
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Cache poetry dependencies
      - name: Cache poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      # Install frontend dependencies for testing
      - name: Install frontend dependencies
        run: npm install

      # Install backend dependencies for testing
      - name: Install backend dependencies
        run: |
          pip install poetry
          poetry install

      # Install tools if cache miss
      - name: Install tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools
          echo "Installing gitea-mcp..."
          wget -q https://gitea.com/gitea/gitea-mcp/releases/download/v0.1.9/gitea-mcp_Linux_x86_64.tar.gz
          tar -xzf gitea-mcp_Linux_x86_64.tar.gz -C .tools
          chmod +x .tools/gitea-mcp
          rm gitea-mcp_Linux_x86_64.tar.gz
          echo "Installing tea CLI..."
          curl -sL https://dl.gitea.io/tea/0.9.2/tea-0.9.2-linux-amd64 > .tools/tea
          chmod +x .tools/tea
          echo "Installing jq..."
          curl -sL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 > .tools/jq
          chmod +x .tools/jq

      # Add tools to PATH
      - name: Add tools to PATH
        run: echo "$PWD/.tools" >> $GITHUB_PATH

      # Authenticate tea
      - name: Authenticate tea
        env:
          GITEA_SERVER_URL: https://gitea.zaks.io
          GITEA_SERVER_TOKEN: ${{ secrets.GT_TOKEN }}
        run: tea login add --name ci

      # Configure Git
      - name: Configure Git
        run: |
          git config user.name "Claude Auto-Fix Bot"
          git config user.email "autofix@zaks.io"

      # Setup MCP configuration
      - name: Setup MCP Configuration
        env:
          GITEA_ACCESS_TOKEN: ${{ secrets.GT_TOKEN }}
          GITEA_BASE: ${{ github.server_url }}
        run: |
          cat > mcp-config.json << EOF
          {
            "mcpServers": {
              "gitea": {
                "command": "${{ github.workspace }}/.tools/gitea-mcp",
                "args": ["-host", "${{ github.server_url }}", "-token", "${{ secrets.GT_TOKEN }}"],
                "env": {
                  "GITEA_ACCESS_TOKEN": "${{ secrets.GT_TOKEN }}",
                  "GITEA_BASE": "${{ github.server_url }}"
                }
              }
            }
          }
          EOF

      # Step 1: Analyze issue and create plan
      - name: Analyze Issue and Create Plan
        uses: anthropics/claude-code-base-action@beta
        env:
          GITEA_ACCESS_TOKEN: ${{ secrets.GT_TOKEN }}
          GITEA_BASE: ${{ github.server_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-4-20250514"
          max_turns: 15
          mcp_config: "mcp-config.json"
          allowed_tools: "Read,Write,View,Glob,GlobTool,Grep,GrepTool,Bash(git:*),Bash(find:*),Bash(ls:*),Bash(grep:*),Bash(jq:*),Edit,MultiEdit,mcp__gitea__get_issue_by_index,mcp__gitea__create_issue_comment"
          prompt: |
            You are analyzing issue #${{ github.event.issue.number }} in this Gitea repository.

            IMPORTANT: You have access to Gitea MCP tools. Use `mcp__gitea__get_issue_by_index` to get issue details and `mcp__gitea__create_issue_comment` to post comments.

            Steps to follow:
            1. Get issue details using: mcp__gitea__get_issue_by_index with index ${{ github.event.issue.number }}
            2. Analyze the issue thoroughly and understand what needs to be fixed
            3. Search the codebase to identify files that need modification
            4. Create a detailed step-by-step plan to fix the issue
            5. Write your plan to a file named 'fix-plan.md' with clear, actionable steps
            6. Post a comment on the issue summarizing your analysis and plan

            The plan file should include:
            - Clear problem statement
            - List of files that need to be modified
            - Detailed implementation steps
            - Required test cases

            If you encounter any errors or need additional permissions, leave a comment on the issue using the Gitea MCP explaining what's needed.

      # Step 2a: Prepare implementation prompt
      - name: Prepare Implementation Prompt
        run: |
          cat >> fix-plan.md << 'EOF'

          ---

          ## Implementation Instructions

          You are implementing the fix for issue #${{ github.event.issue.number }} based on the plan above.

          Follow the plan step by step to implement the fix. Make sure to:
          1. Read and understand the full plan before starting
          2. Implement each step carefully following project conventions
          3. Use appropriate code style and patterns from the existing codebase
          4. Create or modify files as outlined in the plan
          5. Write a file named 'test-requirements.md' describing:
             - What tests need to be written
             - Which existing tests might be affected
             - How to verify the fix works correctly

          If you encounter any errors or blockers, post a comment on the issue and continue with what you can.
          EOF

      # Step 2b: Implement the plan
      - name: Implement the Plan
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        env:
          GITEA_ACCESS_TOKEN: ${{ secrets.GT_TOKEN }}
          GITEA_BASE: ${{ github.server_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-4-20250514"
          max_turns: 25
          mcp_config: "mcp-config.json"
          allowed_tools: "Read,Write,View,Edit,MultiEdit,Glob,GlobTool,Grep,GrepTool,Bash(git:*),Bash(find:*),Bash(ls:*),Bash(grep:*),Bash(jq:*),mcp__gitea__create_issue_comment"
          prompt_file: "fix-plan.md"

      # Step 3a: Prepare test implementation prompt
      - name: Prepare Test Implementation Prompt
        if: always()
        run: |
          if [ -f "test-requirements.md" ]; then
            cat >> test-requirements.md << 'EOF'
          else
            echo "test-requirements.md not found, creating minimal version..."
            cat > test-requirements.md << 'EOF'
          # Test Requirements (Generated - Original Missing)

          The previous implementation step may have failed. Please analyze what went wrong and create appropriate tests for any partial implementation.
          EOF
          fi
          cat >> test-requirements.md << 'EOF'

          ---

          ## Test Implementation Instructions

          You are implementing tests for the fix to issue #${{ github.event.issue.number }}.

          Based on the test requirements above:
          1. Implement all necessary unit tests
          2. Update existing tests if needed
          3. Run tests to ensure they pass:
             - For frontend: npm test
             - For backend: poetry run pytest
          4. Fix any failing tests
          5. Write a file named 'review-summary.md' containing:
             - List of implemented changes
             - List of tests added/modified
             - Test results
             - Any remaining issues or concerns

          If tests fail, iterate on fixes until they pass. Post a comment on the issue if you encounter blockers.
          EOF

      # Step 3b: Implement tests
      - name: Implement Tests
        if: always()
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        env:
          GITEA_ACCESS_TOKEN: ${{ secrets.GT_TOKEN }}
          GITEA_BASE: ${{ github.server_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-4-20250514"
          max_turns: 25
          mcp_config: "mcp-config.json"
          allowed_tools: "Read,Write,View,Edit,MultiEdit,Glob,GlobTool,Grep,GrepTool,Bash(npm:*),Bash(poetry:*),Bash(pytest:*),Bash(jest:*),Bash(git:*),Bash(find:*),Bash(ls:*),Bash(grep:*),Bash(jq:*),mcp__gitea__create_issue_comment"
          prompt_file: "test-requirements.md"

      # Step 4a: Check if normal review is possible
      - name: Check Review File Status
        id: check-review
        if: always()
        run: |
          if [ -f "review-summary.md" ]; then
            echo "review_exists=true" >> $GITHUB_OUTPUT
          else
            echo "review_exists=false" >> $GITHUB_OUTPUT
          fi

      # Step 4b: Prepare normal review prompt (if review-summary.md exists)
      - name: Prepare Normal Review Prompt
        if: steps.check-review.outputs.review_exists == 'true'
        run: |
          cat >> review-summary.md << 'EOF'

          ---

          ## Review Instructions

          You are reviewing the fix for issue #${{ github.event.issue.number }}.

          Steps to follow:
          1. Get the original issue details using: mcp__gitea__get_issue_by_index with index ${{ github.event.issue.number }}
          2. Review all changes made based on the review summary above
          3. Run all tests to ensure they pass:
             - npm test
             - poetry run pytest
          4. Run linting to ensure code quality:
             - npm run lint
             - poetry run ruff check src/neuron_server/
          5. Verify the fix addresses the original issue completely
          6. Post a detailed comment on the issue with:
             - Summary of changes made
             - Test results
             - Verification that the issue is fixed
             - Any caveats or follow-up work needed

          If the fix is successful and all tests pass:
          - Create a branch named 'fix-issue-${{ github.event.issue.number }}'
          - Commit all changes with a descriptive message
          - Push the branch using: git push -u origin fix-issue-${{ github.event.issue.number }}
          - Create a pull request using mcp__gitea__create_pull_request that:
            * References "Fixes #${{ github.event.issue.number }}"
            * Includes a summary of changes
            * Lists all tests that verify the fix
          - Post a final comment on the issue with the PR link

          If the fix is incomplete or tests fail:
          - Document what went wrong in detail
          - Explain what additional work is needed
          - Post a comment explaining the situation
          - Leave the issue open for manual intervention

          IMPORTANT: If you encounter any permission errors or tool access issues, post a comment on the issue explaining what additional access is needed.
          EOF

      # Step 4c: Create debug prompt (if review-summary.md is missing)
      - name: Create Debug Analysis Prompt
        if: steps.check-review.outputs.review_exists == 'false'
        run: |
          cat > debug-analysis.md << 'EOF'
          # Auto-Fix Debug Analysis

          The auto-fix process for issue #${{ github.event.issue.number }} encountered problems. You need to analyze what went wrong and provide debugging guidance.

          ## Debug Instructions

          1. Get the original issue details using: mcp__gitea__get_issue_by_index with index ${{ github.event.issue.number }}
          2. Check which files were created during the process:
             - Does fix-plan.md exist? Read it if so.
             - Does test-requirements.md exist? Read it if so.
             - Look for any other generated files
          3. Examine the current state of the codebase for any partial changes
          4. Check git status to see what files were modified
          5. Look for any error logs or failed test outputs
          6. Analyze what went wrong in the previous steps:
             - Did the implementation step fail?
             - Did the testing step fail?
             - Were there permission issues?
             - Were there dependency issues?
             - Were there syntax errors in generated code?
          7. Post a comprehensive debug comment on the issue including:
             - What files were found/missing (fix-plan.md, test-requirements.md, review-summary.md)
             - Current git status and any changes made
             - Likely reasons for failure based on the evidence
             - Specific steps needed for manual intervention
             - Any error messages or logs found
             - Recommendations for fixing the auto-fix process

          Be thorough in your analysis and provide actionable debugging information.
          EOF

      # Step 4d: Normal Review and Verify Fix
      - name: Review and Verify Fix
        if: steps.check-review.outputs.review_exists == 'true'
        uses: anthropics/claude-code-base-action@beta
        env:
          GITEA_ACCESS_TOKEN: ${{ secrets.GT_TOKEN }}
          GITEA_BASE: ${{ github.server_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-4-20250514"
          max_turns: 25
          mcp_config: "mcp-config.json"
          allowed_tools: "Read,Write,View,Edit,MultiEdit,Glob,GlobTool,Grep,GrepTool,Bash(npm:*),Bash(poetry:*),Bash(pytest:*),Bash(jest:*),Bash(git:*),Bash(find:*),Bash(ls:*),Bash(grep:*),Bash(jq:*),mcp__gitea__get_issue_by_index,mcp__gitea__create_issue_comment,mcp__gitea__edit_issue,mcp__gitea__create_pull_request"
          prompt_file: "review-summary.md"

      # Step 4e: Debug Analysis (when review failed)
      - name: Debug Analysis
        if: steps.check-review.outputs.review_exists == 'false'
        uses: anthropics/claude-code-base-action@beta
        env:
          GITEA_ACCESS_TOKEN: ${{ secrets.GT_TOKEN }}
          GITEA_BASE: ${{ github.server_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-4-20250514"
          max_turns: 25
          mcp_config: "mcp-config.json"
          allowed_tools: "Read,Write,View,Edit,MultiEdit,Glob,GlobTool,Grep,GrepTool,Bash(git:*),Bash(find:*),Bash(ls:*),Bash(grep:*),Bash(jq:*),mcp__gitea__get_issue_by_index,mcp__gitea__create_issue_comment"
          prompt_file: "debug-analysis.md"
