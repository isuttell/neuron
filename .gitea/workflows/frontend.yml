name: Frontend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'src/neuron_client/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'tailwind.config.js'
      - 'vite.config.ts'
      - '.gitea/workflows/frontend.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/neuron_client/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'tailwind.config.js'
      - 'vite.config.ts'
      - '.gitea/workflows/frontend.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
