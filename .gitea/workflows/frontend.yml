name: Frontend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'src/neuron_client/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'tailwind.config.js'
      - 'vite.config.ts'
      - '.gitea/workflows/frontend.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/neuron_client/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'tailwind.config.js'
      - 'vite.config.ts'
      - '.gitea/workflows/frontend.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Report cache status
        run: |
          if [ "${{ steps.npm-cache.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Using cached node_modules"
          else
            echo "🔄 Fresh install of dependencies"
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Cache build output
        uses: actions/cache@v3
        id: build-cache
        with:
          path: dist
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build
        run: npm run build
