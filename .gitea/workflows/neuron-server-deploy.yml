name: Neuron Server Deploy

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.gitea/workflows/neuron-server-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.zaks.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Calculate Dockerfile hash
        id: dockerfile-hash
        run: echo "hash=$(sha256sum Dockerfile | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
          install: true

# Docker driver with buildx uses its own internal caching mechanism

      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: |
            gitea.zaks.io/isuttell/neuron:latest
            ${{ startsWith(github.ref, 'refs/tags/') && format('gitea.zaks.io/isuttell/neuron:{0}', github.ref_name) || '' }}

      - name: Deployment notification
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "🚀 Successfully pushed image gitea.zaks.io/isuttell/neuron:${{ github.ref_name }} for production deployment"
          else
            echo "🚀 Successfully pushed image gitea.zaks.io/isuttell/neuron:latest for staging deployment"
          fi
