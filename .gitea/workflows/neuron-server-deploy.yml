name: Neuron Server Deploy

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.gitea/workflows/neuron-server-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.zaks.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            gitea.zaks.io/isuttell/neuron:latest
            ${{ startsWith(github.ref, 'refs/tags/') && format('gitea.zaks.io/isuttell/neuron:{0}', github.ref_name) || '' }}

      - name: Deployment notification
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "🚀 Deploying tagged release ${{ github.ref_name }} to production"
          else
            echo "🚀 Deploying latest build from ${{ github.ref_name }} to staging"
          fi
