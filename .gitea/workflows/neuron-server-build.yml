name: Neuron Server Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.gitea/workflows/neuron-server-build.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.gitea/workflows/neuron-server-build.yml'

jobs:
  build-neuron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set build mode based on event
        id: build-mode
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Building image to validate but not pushing for PR"
            echo "is_pr=true" >> $GITHUB_OUTPUT
          else
            echo "Building and pushing image for ${{ github.ref }}"
            echo "is_pr=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to Gitea Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: gitea.zaks.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        id: docker-cache
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build image only (PR)
        if: github.event_name == 'pull_request'
        id: build-only
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          builder: buildx
          load: true
          push: false
          tags: gitea.zaks.io/isuttell/neuron:pr-${{ github.event.pull_request.number }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Verify build success (PR)
        if: github.event_name == 'pull_request'
        run: |
          echo "✅ Build verification successful for PR #${{ github.event.pull_request.number }}"
          echo "Image was built but not pushed to registry as per PR policy"

      - name: Build and push image (non-PR)
        if: github.event_name != 'pull_request'
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          builder: buildx
          push: true
          tags: |
            gitea.zaks.io/isuttell/neuron:latest
            ${{ startsWith(github.ref, 'refs/tags/') && format('gitea.zaks.io/isuttell/neuron:{0}', github.ref_name) || '' }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Temp fix for https://github.com/docker/build-push-action/issues/252
      # This will move the cache to the correct location for the next run
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
