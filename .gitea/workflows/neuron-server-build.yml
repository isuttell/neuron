name: Neuron Server Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    paths:
      - 'src/neuron_server/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.gitea/workflows/neuron-server-build.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/neuron_server/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.gitea/workflows/neuron-server-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Gitea Container Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: gitea.zaks.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Calculate Dockerfile hash
        id: dockerfile-hash
        run: echo "hash=$(sha256sum Dockerfile | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
          install: true

# Docker driver with buildx uses its own internal caching mechanism

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            gitea.zaks.io/isuttell/neuron-server:latest
            ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/') && format('gitea.zaks.io/isuttell/neuron-server:{0}', github.ref_name) || '' }}

      - name: Build notification
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "✅ Successfully built image for PR #${{ github.event.pull_request.number }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "🔧 Successfully pushed image gitea.zaks.io/isuttell/neuron-server:latest via manual trigger"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "🚀 Successfully pushed image gitea.zaks.io/isuttell/neuron-server:${{ github.ref_name }} for production deployment"
          else
            echo "🚀 Successfully pushed image gitea.zaks.io/isuttell/neuron-server:latest for staging deployment"
          fi
