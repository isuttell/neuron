name: Backend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'src/neuron_server/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.gitea/workflows/backend.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/neuron_server/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.gitea/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: /root/.local/bin/poetry install

      - name: Lint with Ruff
        run: /root/.local/bin/poetry run ruff check src/neuron_server/

      - name: Run tests
        run: /root/.local/bin/poetry run pytest src/neuron_server/ --cov
