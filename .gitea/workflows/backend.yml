name: Backend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'src/neuron_server/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.gitea/workflows/backend.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/neuron_server/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.gitea/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            poetry.lock

      - name: Setup Poetry
        uses: pronovic/setup-poetry@v2
        with:
          version: "1.8.0"
          cache-venv: "true"
          cache-poetry: "true"

      - name: Install dependencies
        run: poetry install

      - name: Lint with Ruff
        run: poetry run ruff check src/neuron_server/

      - name: Cache pytest
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-pytest-${{ hashFiles('**/poetry.lock') }}-${{ hashFiles('**/src/neuron_server/**') }}
          restore-keys: |
            ${{ runner.os }}-pytest-${{ hashFiles('**/poetry.lock') }}-
            ${{ runner.os }}-pytest-

      - name: Run tests
        run: poetry run pytest src/neuron_server/ --cov
