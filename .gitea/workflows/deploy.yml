name: Deploy

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # Determine what needs to be built
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/neuron_server/**'
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'Dockerfile'
            frontend:
              - 'src/neuron_client/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'tailwind.config.js'
              - 'vite.config.ts'
              - 'Dockerfile.client'
              - 'nginx.conf'
              - 'postcss.config.js'
              - 'components.json'

  # Build and push backend if changed
  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.zaks.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: |
            gitea.zaks.io/isuttell/neuron-server:latest
            ${{ startsWith(github.ref, 'refs/tags/') && format('gitea.zaks.io/isuttell/neuron-server:{0}', github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy notification
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "🔧 Successfully pushed backend image via manual trigger"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "🚀 Successfully pushed backend image with tag ${{ github.ref_name }}"
          else
            echo "🚀 Successfully pushed backend image to latest"
          fi

  # Build and push frontend if changed
  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.zaks.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.client
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: |
            gitea.zaks.io/isuttell/neuron-client:latest
            ${{ startsWith(github.ref, 'refs/tags/') && format('gitea.zaks.io/isuttell/neuron-client:{0}', github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy notification
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "🔧 Successfully pushed frontend image via manual trigger"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "🚀 Successfully pushed frontend image with tag ${{ github.ref_name }}"
          else
            echo "🚀 Successfully pushed frontend image to latest"
          fi
