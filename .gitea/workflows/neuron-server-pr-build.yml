name: Neuron Server PR Build

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.gitea/workflows/neuron-server-pr-build.yml'

jobs:
  build-neuron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate Dockerfile hash
        id: dockerfile-hash
        run: echo "hash=$(sha256sum Dockerfile | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-pr-${{ steps.dockerfile-hash.outputs.hash }}-${{ github.event.pull_request.number }}
          restore-keys: |
            ${{ runner.os }}-buildx-pr-${{ steps.dockerfile-hash.outputs.hash }}-
            ${{ runner.os }}-buildx-pr-

      - name: Build image
        id: build-only
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          builder: buildx
          push: false
          load: true
          tags: gitea.zaks.io/isuttell/neuron:pr-${{ github.event.pull_request.number }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Temp fix for https://github.com/docker/build-push-action/issues/252
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true
