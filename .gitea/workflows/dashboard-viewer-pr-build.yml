name: Dashboard Viewer PR Build

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'src/dashboard-viewer/**'
      - '.gitea/workflows/dashboard-viewer-pr-build.yml'

jobs:
  build-dashboard-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate Dockerfile hash
        id: dockerfile-hash
        working-directory: src/dashboard-viewer
        run: echo "hash=$(sha256sum Dockerfile | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
          install: true

      - name: Build image
        id: build-only
        uses: docker/build-push-action@v5
        with:
          context: src/dashboard-viewer
          file: src/dashboard-viewer/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: false
          load: true
          tags: gitea.zaks.io/isuttell/dashboard-viewer:pr-${{ github.event.pull_request.number }}
