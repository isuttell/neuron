name: Claude PR Review

on:
  pull_request:
    types: [opened]
    branches: [ master ]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Cache tools directory
      - name: Cache tools
        id: cache-tools
        uses: actions/cache@v3
        with:
          path: ./.tools
          key: ${{ runner.os }}-tools-v1-gitea-mcp-0.1.9-claude-cli

      # Setup Node.js with its own caching
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      # Single step to install tools if cache miss
      - name: Install tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          # Create tools directory
          mkdir -p .tools
          echo "Installing gitea-mcp..."

          # Download and extract gitea-mcp to our tools directory
          wget -q https://gitea.com/gitea/gitea-mcp/releases/download/v0.1.9/gitea-mcp_Linux_x86_64.tar.gz
          tar -xzf gitea-mcp_Linux_x86_64.tar.gz -C .tools
          chmod +x .tools/gitea-mcp
          rm gitea-mcp_Linux_x86_64.tar.gz

          # Create a package.json for local installation
          echo '{"name":"code-review-tools","private":true,"dependencies":{"@anthropic-ai/claude-code":"latest"}}' > .tools/package.json

          # Install Claude CLI locally
          cd .tools
          npm install
          cd ..

      # Add tools to PATH
      - name: Add tools to PATH
        run: |
          # Add our tools directory to PATH
          echo "$PWD/.tools" >> $GITHUB_PATH
          echo "$PWD/.tools/node_modules/.bin" >> $GITHUB_PATH

      # Verify tools are working
      - name: Verify tools
        run: |
          gitea-mcp --version || echo "gitea-mcp version not available"
          claude --version || echo "Claude version not available"

      # Configure Claude
      - name: Configure Claude
        env:
          GITEA_ACCESS_TOKEN: ${{ secrets.GT_TOKEN }}
          GITEA_BASE: ${{ gitea.server_url }}
        run: |
          # Configure MCP server
          claude mcp add gitea \
            -e GITEA_ACCESS_TOKEN=$GITEA_ACCESS_TOKEN \
            -- ${{ github.workspace }}/.tools/gitea-mcp \
            -host $GITEA_BASE \
            -token $GITEA_ACCESS_TOKEN

          claude mcp list
          echo "Configured MCP server for Gitea"

          # Configure tools
          claude config add allowedTools "Read"
          claude config add allowedTools "Bash(git show:*)"
          claude config add allowedTools "Bash(git log:*)"
          claude config add allowedTools "Bash(git diff:*)"
          claude config add allowedTools "mcp__gitea__create_issue_comment"
          claude config add allowedTools "mcp__gitea__get_pull_request_by_index"

          echo "Configured Claude allowed tools"
          claude config get allowedTools

      - name: Run Claude review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITEA_ACCESS_TOKEN: ${{ secrets.GT_TOKEN }}
          PR_NUMBER: ${{ gitea.event.pull_request.number }}
        run: |
          echo "Fetching PR diff..."
          # Fetch the PR diff from Gitea API
          curl -sSL -H "Authorization: token $GITEA_ACCESS_TOKEN" \
            "${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository_owner }}/${{ gitea.repository_name }}/pulls/$PR_NUMBER.diff" \
            -o pr.diff

          echo "Running code review..."
          PROMPT="Please review the code changes in this PR based on the diff.

          1. Read all previous comments on the PR #$PR_NUMBER to understand ongoing discussions
          2. Continue any conversation threads from previous comments when appropriate
          3. Read related code for additional context so you understand the impact of the diff
          4. Analyze code quality, potential bugs, and improvements of diff
          5. Use Gitea MCP tools to comment directly on PR #$PR_NUMBER
          6. Be specific in your comments and reference line numbers when possible
          7. Focus on problems and potential improvements

          Your response should be concise, professional, and clever. Avoid unnecessary explanations and focus on meaningful insights."

          # Create input for Claude that includes both prompt and diff
          (echo "$PROMPT"; echo; echo "<git_diff>"; cat pr.diff; echo "</git_diff>") | claude -p --max-turns 25
