name: Claude PR Review

on:
  pull_request:
    types: [opened]
    branches: [master]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache tools directory
      - name: Cache tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ./.tools
          key: ${{ runner.os }}-tools-v1-gitea-mcp-0.1.9

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install Gitea MCP if cache miss
      - name: Install Gitea MCP
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools
          echo "Installing gitea-mcp..."
          wget -q https://gitea.com/gitea/gitea-mcp/releases/download/v0.1.9/gitea-mcp_Linux_x86_64.tar.gz
          tar -xzf gitea-mcp_Linux_x86_64.tar.gz -C .tools
          chmod +x .tools/gitea-mcp
          rm gitea-mcp_Linux_x86_64.tar.gz

      # Add tools to PATH
      - name: Add tools to PATH
        run: echo "$PWD/.tools" >> $GITHUB_PATH

      # Setup MCP configuration
      - name: Setup MCP Configuration
        env:
          GITEA_ACCESS_TOKEN: ${{ secrets.GT_TOKEN }}
          GITEA_BASE: ${{ github.server_url }}
        run: |
          cat > mcp-config.json << EOF
          {
            "mcpServers": {
              "gitea": {
                "command": "${{ github.workspace }}/.tools/gitea-mcp",
                "args": ["-host", "${{ github.server_url }}", "-token", "${{ secrets.GT_TOKEN }}"],
                "env": {
                  "GITEA_ACCESS_TOKEN": "${{ secrets.GT_TOKEN }}",
                  "GITEA_BASE": "${{ github.server_url }}"
                }
              }
            }
          }
          EOF

      # Run Claude Code review
      - name: Claude Code Review
        uses: anthropics/claude-code-base-action@beta
        env:
          GITEA_ACCESS_TOKEN: ${{ secrets.GT_TOKEN }}
          GITEA_BASE: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-4-20250514"
          max_turns: 25
          mcp_config: "mcp-config.json"
          allowed_tools: "Read,Bash(git:*),mcp__gitea__create_issue_comment,mcp__gitea__get_pull_request_by_index"
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }} in this Gitea repository.

            IMPORTANT: You MUST use the Gitea MCP tools available to you:
            - Use `mcp__gitea__get_pull_request_by_index` to get PR details
            - Use `mcp__gitea__create_issue_comment` to post your review comments

            Steps to follow:
            1. Get PR details using: mcp__gitea__get_pull_request_by_index with index ${{ github.event.pull_request.number }}
            2. Get the code diff using: git diff origin/master...HEAD
            3. Read related files for additional context to understand the impact of changes
            4. Analyze code quality, potential bugs, and improvements in the diff
            5. Use the Gitea MCP tools to leave a comment with your recommendations

            Your review should be:
            - Concise, professional, and insightful
            - Specific with line numbers when possible
            - Focused on problems and potential improvements
            - Free of unnecessary explanations
