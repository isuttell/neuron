name: Dashboard Viewer CI

on:
  push:
    paths:
      - 'src/dashboard-viewer/**'
      - '.gitea/workflows/dashboard-viewer.yml'
  pull_request:
    paths:
      - 'src/dashboard-viewer/**'
      - '.gitea/workflows/dashboard-viewer.yml'

jobs:
  # Test and build dashboard viewer
  test:
    name: Dashboard Viewer Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'src/dashboard-viewer/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install frontend dependencies
        working-directory: src/dashboard-viewer
        run: npm ci

      - name: Install backend dependencies
        working-directory: src/dashboard-viewer
        run: poetry install --no-interaction --no-ansi

      - name: Run frontend linting
        working-directory: src/dashboard-viewer
        run: npm run lint

      - name: Run frontend type checking
        working-directory: src/dashboard-viewer
        run: npx tsc --noEmit

      - name: Run frontend tests
        working-directory: src/dashboard-viewer
        run: npm test

      - name: Run frontend build
        working-directory: src/dashboard-viewer
        run: npm run build

      - name: Run backend tests
        working-directory: src/dashboard-viewer
        run: poetry run pytest tests/ --cov=dashboard_viewer/ --cov-report=xml --cov-report=term

  # Docker build test
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: src/dashboard-viewer
        run: docker build -t dashboard-viewer:test .

      - name: Test Docker image
        working-directory: src/dashboard-viewer
        run: |
          # Start container in background with test image URL
          docker run -d --name dashboard-test -p 8000:8000 \
            -e IMAGE_URL=https://httpbin.org/base64/iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg== \
            dashboard-viewer:test

          # Wait for container to start
          sleep 15

          # Test health endpoint with retry
          for i in {1..5}; do
            if curl -f http://localhost:8000/api/status; then
              echo "Health check passed"
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 3
          done

          # Test that the main endpoint is accessible
          curl -f http://localhost:8000/ > /dev/null

          # Cleanup
          docker stop dashboard-test
          docker rm dashboard-test
