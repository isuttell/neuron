name: Gitea Actions Lint

on:
  pull_request:
    paths:
      - '.gitea/workflows/**'

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cache actionlint binary
      - name: Cache actionlint
        id: cache-actionlint
        uses: actions/cache@v4
        with:
          path: /usr/bin/actionlint
          key: ${{ runner.os }}-actionlint-v1.6.26

      # Install actionlint if not cached
      - name: Install actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        run: |
          echo "Installing actionlint..."
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest /usr/bin

      # Run actionlint on all workflow files
      - name: Run actionlint
        run: |
          actionlint -color .gitea/workflows/*.yml

          # Check exit code
          if [ $? -eq 0 ]; then
            echo "✅ All workflow files passed actionlint checks"
          else
            echo "❌ Some workflow files failed actionlint checks"
            exit 1
          fi
