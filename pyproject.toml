[tool.poetry]
name = "neuron_server"
version = "0.1.0"
description = ""
authors = ["Isaac Suttell <isaac@isaacsuttell.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
python-dotenv = "*"
huggingface_hub = "*"
opencv-python-headless = "*"
pillow = "*"
pydantic = "*"
quart = "*"
hypercorn = "*"
langchain = "*"
langgraph = "*"
langchain_openai = "*"
langchain_community = "*"
langchain_anthropic = "*"
langchain_postgres = "*"
langchain-cohere = "*"
langgraph-checkpoint-postgres = "*"
langchain-text-splitters = "*"
langsmith = "*"
simsimd = "*"
aiohttp = "*"
arxiv = "*"
pymupdf4llm = "*"
pymupdf = "*"
elevenlabs = "*"
sqlalchemy = { version = "*", extras = ["asyncio"] }
psycopg = { version = "*", extras = ["binary", "pool"] }
psycopg-pool = "*"
redis = { version = "*", extras = ["hiredis"] }
skyfield = "*"
pandas = "*"
astroquery = "*"
wikipedia = "*"
astropy = "*"
pyvo = "*"
astroplan = "*"
matplotlib = "*"
tabulate = "*"
starplot = "*"
wolframalpha = "*"
RestrictedPython = "*"
langchain_neo4j = "*"
neo4j = "*"
firecrawl-py = "*"
replicate = "*"
aiofiles = "*"
piexif = "*"
yt-dlp = "*"
pyjwt = { version = "*", extras = ["crypto"] }
lxml = "*"
pi-heif = "*"
youtube-transcript-api = "*"
langchain-google-genai = "^2.1.3"

[tool.poetry.group.dev.dependencies]
aioresponses = "*"
pytest = "*"
pytest-cov = "*"
pytest-asyncio = "*"
pytest-aiohttp = "*"
ruff = "*"
black = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


# Assume Python 3.11
target-version = "py311"

# Enable auto-fixes
fix = true

[tool.ruff.lint]
# Enable pycodestyle, Pyflakes, isort, and more
select = ["E", "F", "I", "N", "UP", "ANN", "B", "A", "C4", "RET", "SIM", "ERA", "PL"]
ignore = []
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["neuron_server"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Ignore unused imports in __init__.py files

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
addopts = "-W ignore::DeprecationWarning"
