[tool.poetry]
name = "neuron_server"
version = "0.1.0"
description = ""
authors = ["Isaac Suttell <isaac@isaacsuttell.com>"]

[tool.poetry.dependencies]
python = "^3.11"
python-dotenv = "*"
huggingface_hub = "*"
opencv-python-headless = "*"
pillow = "*"
pydantic = "*"
quart = "*"
langchain = "*"
langgraph = "*"
langchain_huggingface = "*"
langchain_openai = "*"
langchain_community = "*"
langchain_anthropic = "*"
langsmith = "*"
aiohttp = "*"
arxiv = "*"
pymupdf4llm = "*"
elevenlabs = "*"
asyncpg = "*"
sqlalchemy = { version = "*", extras = ["asyncio"] }
sentence-transformers = "*"
torch = { version = "*", source = "pytorch" }
langchain_postgres = "*"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
default = false

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
