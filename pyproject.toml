[tool.poetry]
name = "neuron_server"
version = "0.1.0"
description = ""
authors = ["Isaac Suttell <isaac@isaacsuttell.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
python-dotenv = "*"
huggingface_hub = "*"
opencv-python-headless = "*"
pillow = "*"
pydantic = "*"
quart = "*"
hypercorn = "*"
langchain = "*"
langgraph = "*"
langchain_openai = "*"
langchain_community = "*"
langchain_anthropic = "*"
langchain_postgres = "*"
langchain-cohere = "*"
langgraph-checkpoint-postgres = "*"
langchain-text-splitters = "*"
langsmith = "*"
simsimd = "*"
aiohttp = "*"
arxiv = "*"
pymupdf4llm = "*"
pymupdf = "*"
elevenlabs = "*"
sqlalchemy = { version = "*", extras = ["asyncio"] }
psycopg = { version = "*", extras = ["binary", "pool"] }
psycopg-pool = "*"
redis = { version = "*", extras = ["hiredis"] }
skyfield = "*"
pandas = "*"
astroquery = "*"
wikipedia = "*"
astropy = "*"
pyvo = "*"
astroplan = "*"
matplotlib = "*"
tabulate = "*"
starplot = "*"
wolframalpha = "*"
RestrictedPython = "*"
langchain_neo4j = "*"
neo4j = "*"
firecrawl-py = "*"
replicate = "^1.0.7"
aiofiles = "*"
piexif = "*"
yt-dlp = "*"
pyjwt = { version = "*", extras = ["crypto"] }
lxml = "*"
pi-heif = "*"
youtube-transcript-api = "*"
langchain-google-genai = "^2.1.3"

[tool.poetry.group.dev.dependencies]
aioresponses = "*"
pytest = "*"
pytest-cov = "*"
pytest-asyncio = "*"
pytest-aiohttp = "*"
ruff = "*"
black = "*"
pytest-testmon = "2.1.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


# Assume Python 3.11
target-version = "py311"

# Enable auto-fixes
fix = true

[tool.ruff.lint]
# Enable pycodestyle, Pyflakes, isort, and more
select = ["E", "F", "I", "N", "UP", "ANN", "B", "A", "C4", "RET", "SIM", "ERA", "PL"]
ignore = []
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["neuron_server"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Ignore unused imports in __init__.py files
"src/neuron_server/tests/**" = [
    "S101",    # Use of assert detected (tests use asserts)
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "ARG005",  # Unused lambda argument
    "PLR0913", # Too many arguments to function call
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "PT011",   # pytest.raises() is too broad
    "PT013",   # Found incorrect import of pytest
    "INP001",  # File is part of an implicit namespace package
    "FA102",   # Missing from __future__ import annotations
    "COM812",  # Trailing comma missing
    "ANN001",  # Missing type annotation for function argument
    "ANN002",  # Missing type annotation for *args
    "ANN003",  # Missing type annotation for **kwargs
    "ANN201",  # Missing return type annotation for public function
    "ANN202",  # Missing return type annotation for private function
    "Q000",    # Single quotes found but double quotes preferred
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
addopts = "-W ignore::DeprecationWarning"
