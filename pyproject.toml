[tool.poetry]
name = "neuron_server"
version = "0.1.0"
description = ""
authors = ["Isaac Suttell <isaac@isaacsuttell.com>"]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
python-dotenv = "*"
huggingface_hub = "*"
opencv-python-headless = "*"
pillow = "*"
pydantic = "*"
quart = "*"
hypercorn = "*"
langchain = "0.3.25"
langgraph = "0.4.7"
langchain_openai = "0.3.18"
langchain_community = "0.3.24"
langchain_anthropic = "0.3.13"
langchain_postgres = "0.0.14"
langchain-cohere = "0.4.4"
langgraph-checkpoint-postgres = "2.0.21"
langchain-text-splitters = "0.3.8"
langsmith = "0.3.42"
simsimd = "*"
aiohttp = "*"
arxiv = "*"
pymupdf4llm = "*"
pymupdf = "*"
elevenlabs = "*"
sqlalchemy = { version = "*", extras = ["asyncio"] }
psycopg = { version = "*", extras = ["binary", "pool"] }
psycopg-pool = "*"
redis = { version = "*", extras = ["hiredis"] }
skyfield = "*"
pandas = "*"
astroquery = "*"
wikipedia = "*"
astropy = "*"
pyvo = "*"
astroplan = "*"
matplotlib = "*"
tabulate = "*"
starplot = "*"
wolframalpha = "*"
RestrictedPython = "*"
langchain_neo4j = "0.4.0"
neo4j = "*"
firecrawl-py = "*"
replicate = "^1.0.7"
aiofiles = "*"
piexif = "*"
yt-dlp = "*"
pyjwt = { version = "*", extras = ["crypto"] }
lxml = "*"
pi-heif = "*"
youtube-transcript-api = "*"
langchain-google-genai = "2.1.4"
langchain-sandbox = "^0.0.6"

[tool.poetry.group.dev.dependencies]
aioresponses = "*"
pytest = "*"
pytest-cov = "*"
pytest-asyncio = "*"
pytest-aiohttp = "*"
ruff = "*"
black = "*"
pytest-testmon = "2.1.3"
pre-commit = "*"
mypy = "^1.16.0"
types-aiofiles = "^24.1.0.20250606"
types-redis = "^4.6.0.20241004"
types-lxml = "^2025.3.30"
types-tabulate = "^0.9.0.20241207"
types-pillow = "^10.2.0.20240822"
types-pytz = "^2025.2.0.20250516"
types-requests = "^2.32.0.20250602"
types-markdown = "^3.8.0.20250415"
types-docutils = "^0.21.0.20250604"
types-jsonschema = "^4.24.0.20250528"
types-urllib3 = "^1.26.25.14"
types-jinja2 = "^2.11.9"
types-python-dateutil = "^2.9.0.20250516"
sqlalchemy-stubs = "^0.4"
types-beautifulsoup4 = "^4.12.0.20250516"
types-bleach = "^6.2.0.20250514"
types-cryptography = "^3.3.23.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


# Assume Python 3.12
target-version = "py312"

# Enable auto-fixes
fix = true

[tool.ruff.lint]
# Enable pycodestyle, Pyflakes, isort, and more
select = ["E", "F", "I", "N", "UP", "ANN", "B", "A", "C4", "RET", "SIM", "ERA", "PL"]
ignore = []
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["neuron_server"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Ignore unused imports in __init__.py files
"src/neuron_server/tests/**" = [
    "S101",    # Use of assert detected (tests use asserts)
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "ARG005",  # Unused lambda argument
    "PLR0913", # Too many arguments to function call
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "PT011",   # pytest.raises() is too broad
    "PT013",   # Found incorrect import of pytest
    "INP001",  # File is part of an implicit namespace package
    "FA102",   # Missing from __future__ import annotations
    "COM812",  # Trailing comma missing
    "ANN001",  # Missing type annotation for function argument
    "ANN002",  # Missing type annotation for *args
    "ANN003",  # Missing type annotation for **kwargs
    "ANN201",  # Missing return type annotation for public function
    "ANN202",  # Missing return type annotation for private function
    "Q000",    # Single quotes found but double quotes preferred
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
addopts = "-W ignore::DeprecationWarning"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
strict_equality = true
ignore_missing_imports = true
implicit_reexport = true
no_implicit_reexport = false
namespace_packages = true
show_error_codes = true
show_column_numbers = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Per-module options
[[tool.mypy.overrides]]
module = "neuron_server.tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langgraph.*",
    "langsmith.*",
    "quart.*",
    "hypercorn.*",
    "elevenlabs.*",
    "arxiv.*",
    "astroquery.*",
    "wikipedia.*",
    "wolframalpha.*",
    "RestrictedPython.*",
    "firecrawl.*",
    "replicate.*",
    "piexif.*",
    "yt_dlp.*",
    "youtube_transcript_api.*",
    "simsimd.*",
    "skyfield.*",
    "astropy.*",
    "pyvo.*",
    "astroplan.*",
    "matplotlib.*",
    "starplot.*",
    "pi_heif.*",
    "neo4j.*",
    "pymupdf.*",
    "pymupdf4llm.*",
]
ignore_missing_imports = true
