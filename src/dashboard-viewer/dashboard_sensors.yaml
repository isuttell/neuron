# Dashboard Sensor Configuration
# This file defines HomeAssistant sensors to poll and display on the dashboard

poll_interval: 60 # seconds

sensors:
  # Living Room Temperature
  - entity_id: sensor.weather_station_inside_temperature
    friendly_name: Living Room Temperature
    description: Current temperature in the living room
    display_type: value
    unit_suffix: true # Show unit of measurement
    icon_mapping:
      default: "thermometer"

  # Backyard Temperature
  - entity_id: sensor.weather_station_temperature_2
    friendly_name: Backyard Temperature
    description: Current temperature outside
    display_type: value
    unit_suffix: true
    icon_mapping:
      default: "sun"

  # Feeder Bot Food Level
  - entity_id: sensor.feeder_bot_food_level
    friendly_name: Cat Food Level
    description: Current food level in the feeder
    display_type: value
    unit_suffix: true
    icon_mapping:
      default: "cat"

  # Litter Robot Status
  - entity_id: sensor.litter_robot_4_waste_drawer
    friendly_name: Litter Box Status
    description: Waste drawer status
    display_type: state_text
    unit_suffix: true
    icon_mapping:
      default: "trash-2"

  # Thermostat
  - entity_id: climate.t6_pro_z_wave_programmable_therm
    friendly_name: Thermostat
    description: Living room thermostat
    display_type: state_text
    icon_mapping:
      "heat": "flame"
      "cool": "snowflake"
      "off": "power"
      default: "thermometer"
