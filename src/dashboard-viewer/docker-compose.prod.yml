version: '3.8'

services:
  dashboard-viewer:
    image: gitea.zaks.io/isuttell/dashboard-viewer:latest
    container_name: dashboard-viewer
    environment:
      # For Home Assistant running in host mode with Traefik:

      # Option 1: Direct to HA port on host (RECOMMENDED)
      - IMAGE_URL=http://host.docker.internal:8123/local/dashboard-art.png

      # Option 2: Through Traefik (if Traefik is in Docker)
      # - IMAGE_URL=http://traefik/local/dashboard-art.png

      # Option 3: Using host IP directly
      # - IMAGE_URL=http://192.168.1.160:8123/local/dashboard-art.png

      - PORT=8000
      - HOST=0.0.0.0
      - HOMEASSISTANT_TOKEN=${HOMEASSISTANT_TOKEN}
      - VITE_BASE_PATH=/dashboard
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik
    labels:
      # Enable Traefik for this service
      - "traefik.enable=true"

      # Subpath configuration for https://lapetus.zaks.io/dashboard
      - "traefik.http.routers.dashboard-viewer.rule=Host(`lapetus.zaks.io`) && PathPrefix(`/dashboard`)"
      - "traefik.http.routers.dashboard-viewer.entrypoints=https"

      # Service configuration
      - "traefik.http.services.dashboard-viewer.loadbalancer.server.port=8000"
      - "traefik.http.services.dashboard-viewer.loadbalancer.healthcheck.path=/dashboard/"
      - "traefik.http.services.dashboard-viewer.loadbalancer.healthcheck.timeout=30s"

      # Watchtower auto-updates
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  traefik:
    external: true
