version: '3.8'

services:
  dashboard-viewer:
    build: .
    ports:
      - "${EXTERNAL_PORT:-8000}:8000"
    environment:
      - IMAGE_URL=${IMAGE_URL:-https://ha.zaks.io/local/dashboard-art.png}
      - PORT=8000
      - HOST=0.0.0.0
      - DEV_MODE=true  # Enable auto-reload
      - HOMEASSISTANT_URL=${HOMEASSISTANT_URL:-https://ha.zaks.io}
      - HOMEASSISTANT_TOKEN=${HOMEASSISTANT_TOKEN}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount source files for development
      - ./dashboard_viewer:/app/dashboard_viewer:ro
      - ./dist:/app/dist:ro
      - ./dashboard_sensors.yaml:/app/dashboard_sensors.yaml:ro
    command: ["poetry", "run", "dashboard-viewer"]
